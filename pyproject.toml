[project]
name = "my-team"
version = "0.1.0.dev0"
description = "A locally-running orchestrator that drives a GitHub-backed development loop."
requires-python = ">=3.12"
authors = [{ name = "Coy McNew" }]
# The orchestrator shells out to `gh` and to a harness binary; it has no runtime
# dependencies of its own, and the pure core is plain data over the standard library.
dependencies = []

[project.scripts]
my-team = "my_team.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout. Everything under the package directory ships, which is how the skill
# payload — package data, not code — reaches a target repo.
packages = ["src/my_team"]

[dependency-groups]
dev = [
    "hatchling>=1.25",   # the packaging test builds a wheel through the PEP 517 hook
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/my_team"]
branch = true

[tool.coverage.report]
show_missing = true
# The global floor is a ratchet: raise it as coverage rises, never lower it. The pure
# core carries its own 100% floor, checked separately, because one averaged number
# hides exactly the gap that matters. See .github/workflows/ci.yml.
fail_under = 85
