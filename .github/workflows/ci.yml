name: CI

# The three job ids below are this repo's own `required_checks` when the team is
# pointed at its own source — the gate is declared in config, never inferred — so
# renaming a job here renames a config value there.
# Standard: docs/spec/v0.1.md § "CI gates for the orchestrator repo"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      # A split floor, not one number. One averaged figure lets the untestable
      # adapters pay for the core, which is the one place a gap means a row or a
      # branch is unreached. The global figure is the ratchet (pyproject.toml);
      # the core's is not negotiable.
      - name: Tests, and the global coverage floor
        run: uv run pytest --cov

      - name: The pure core's coverage floor
        run: uv run coverage report --include='src/my_team/core/*' --fail-under=100
