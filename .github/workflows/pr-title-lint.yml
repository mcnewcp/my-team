name: PR title lint

# The PR title becomes the squashed commit subject on `main` and feeds release
# automation, so it is validated as a commit message rather than as prose.
# Standard: docs/agents/commit-conventions.md

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the type table in docs/agents/commit-conventions.md
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: >
            The subject "{subject}" must start with a lowercase letter and must not
            end with a period. See docs/agents/commit-conventions.md.
